appId: com.rebu.bearpool
---
# Reusable login flow, shared by every top-level test in .maestro/tests.
# Params: EMAIL, PASSWORD.
#
# launchApp stops + restarts the app by default, which is what gets us back
# to a clean, signed-out state between logins — the app doesn't persist a
# Firebase Auth session across a full process relaunch, which is what lets
# join-ride.yaml switch between the host and joiner accounts mid-flow.
- launchApp

# The app under test is a dev-client build (eas.json's "e2e" profile) that
# loads JS from a Metro server started by CI instead of a bundle baked into
# the binary. A cold launch lands on expo-dev-launcher's native
# "Development servers" screen, which auto-discovers CI's Metro server and
# lists it, but doesn't auto-connect — tap it, same as a developer would.
# Once tapped, expo-dev-launcher remembers the connection for subsequent
# cold launches within the same simulator session, so this only actually
# taps anything on the very first login of a run.
- tapOn:
    text: "http://localhost:8081"
    optional: true

# First render after connecting to Metro requires a full cold bundle
# transform (confirmed via Metro's own log: as much as ~284s for ~3500
# modules on a loaded CI runner — a prior 240s timeout here was too tight
# and cut this off mid-transform), so wait well beyond that with real
# margin. Subsequent logins within the same run reuse Metro's warm cache
# and are fast.
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 420000

# Confirming focus before typing matters here, not just as a formality:
# without it, a tap's own "done" signal can fire a beat before the
# keyboard/focus has actually landed on the newly-tapped field, so the
# first character or two of the following inputText lands in whichever
# field was PREVIOUSLY focused instead — confirmed via a real failure
# screenshot showing the email field as "<real address>g", the stray "g"
# being the password's first character, typed a moment too early.
- tapOn:
    id: "login-email-input"
- assertVisible:
    id: "login-email-input"
    focused: true
- inputText: ${EMAIL}
- tapOn:
    id: "login-password-input"
- assertVisible:
    id: "login-password-input"
    focused: true
- inputText: ${PASSWORD}
- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible:
      id: "home-feed-screen"
    timeout: 20000
