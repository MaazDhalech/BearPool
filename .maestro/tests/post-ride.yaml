appId: com.rebu.bearpool
---
# Covers ONBOARDING.md §10 "Posting a ride" -> fill in all fields, submit,
# ride appears in the feed (golden path only; missing-field validation,
# editing, and deleting a posted ride are not scripted here).
#
# Required env vars: EMAIL, PASSWORD, DESTINATION (a unique destination
# string, generated by the CI workflow so it can clean the ride up afterward).
- runFlow:
    file: ../flows/login.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- runFlow:
    file: ../flows/post-ride.yaml
    env:
      FROM: "Berkeley - Unit 1"
      TO: ${DESTINATION}
- assertVisible:
    id: "home-feed-screen"
- assertVisible: ${DESTINATION}
