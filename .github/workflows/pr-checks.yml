name: PR Checks

# Runs automatically on every PR into main. Two jobs so the fast lint/typecheck
# feedback doesn't wait behind the slow macOS simulator build + E2E run.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  e2e:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expo SDK 54 / React Native needs a recent Xcode (pod install fails on old ones).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        run: xcodebuild -version

      # Kicked off this early (before the ~25-30min native build on a cache
      # miss) so the simulator finishes booting in the background while the
      # build runs, instead of paying for it sequentially afterward. `boot`
      # itself only *initiates* boot and returns immediately — the actual
      # wait for it to finish happens later via bootstatus, right before
      # it's actually needed, by which point it's usually already done.
      - name: Start booting iOS simulator (runs in background during the build)
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "Booting simulator $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # app.config.js reads these via process.env at build time and bakes them
      # into the binary. The repo's .env is gitignored, so recreate it here from
      # GitHub Actions secrets. Values are masked in logs and never printed.
      - name: Create .env from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          WEB3FORMS_API_KEY: ${{ secrets.WEB3FORMS_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          # Referenced in app.config.js but not in the committed .env — wire up if used.
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          cat > .env <<EOF
          FIREBASE_API_KEY=${FIREBASE_API_KEY}
          FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
          FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
          FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
          FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}
          FIREBASE_APP_ID=${FIREBASE_APP_ID}
          FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY}
          WEB3FORMS_API_KEY=${WEB3FORMS_API_KEY}
          BACKEND_URL=${BACKEND_URL}
          GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID}
          GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}
          EOF

      # "e2e" profile (eas.json) is now a dev-client build: it loads JS from a
      # Metro server at runtime instead of baking a bundle into the binary, so
      # the (expensive) native build below only needs to actually run when
      # something native-relevant changed — JS/TS-only PRs, the vast majority,
      # get a cache hit and skip straight to the already-built app.
      #
      # Split into restore/save (rather than the combined actions/cache@v4)
      # because the combined action's save only runs via a post-hook gated on
      # the *whole job* succeeding — every prior run's build succeeded but the
      # cache never actually saved, because the job kept failing later at the
      # E2E test step. Saving explicitly right after a successful build makes
      # the cache durable regardless of what happens afterward.
      - name: Restore built iOS simulator dev-client app
        id: cache-app
        uses: actions/cache/restore@v4
        with:
          path: BearPool-e2e.tar.gz
          key: ios-e2e-app-${{ hashFiles('ios/**', 'package-lock.json', 'app.config.js', 'eas.json') }}

      # Only matters on a cache miss (native files actually changed) — avoids
      # CocoaPods re-resolving/recompiling every pod from scratch.
      - name: Restore CocoaPods cache
        id: cache-pods
        if: steps.cache-app.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      # Unsigned since simulator apps don't need code-signing credentials, so
      # this can run on every PR from forks too.
      - name: Build iOS simulator app locally on the macOS runner
        if: steps.cache-app.outputs.cache-hit != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COCOAPODS_DISABLE_STATS: true
        run: |
          eas build \
            --platform ios \
            --profile e2e \
            --local \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/BearPool-e2e.tar.gz"

      # Save immediately, before Metro/Maestro even run — see note above.
      - name: Save built iOS simulator dev-client app to cache
        if: steps.cache-app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: BearPool-e2e.tar.gz
          key: ${{ steps.cache-app.outputs.cache-primary-key }}

      - name: Save CocoaPods cache
        if: steps.cache-app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.cache-pods.outputs.cache-primary-key }}

      # Local simulator builds are emitted as a .tar.gz containing the .app
      # bundle. Runs whether the tarball came from a fresh build or the cache
      # above.
      - name: Extract simulator .app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          tar -xzf "$GITHUB_WORKSPACE/BearPool-e2e.tar.gz" -C "$GITHUB_WORKSPACE/build"
          APP_PATH=$(find "$GITHUB_WORKSPACE/build" -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # Boot was already *triggered* right after Xcode setup so it runs in
      # the background during the long build above — this just waits for it
      # to actually finish, which by now is usually immediate.
      - name: Wait for iOS simulator to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Install app on simulator
        run: xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      # Suppresses expo-dev-client's one-time "This is the developer menu"
      # onboarding popup, which otherwise renders on top of the app on its
      # first successful Metro connection and blocks all interaction until
      # dismissed (confirmed via a real Maestro accessibility-tree capture
      # from a failed run — it showed this popup's text sitting over the
      # login screen). Backed by a plain UserDefaults boolean
      # (node_modules/expo-dev-menu/ios/Modules/DevMenuPreferences.swift),
      # scoped to the app's own bundle ID, so it can be set directly here.
      # Must run after install (the app's sandboxed preferences container
      # doesn't exist before that), which is why this step is right after it.
      - name: Disable dev-menu onboarding popup
        run: xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.rebu.bearpool EXDevMenuIsOnboardingFinished -bool YES

      # The dev-client build has no bundled JS, so it needs a live Metro server
      # to load from. --localhost binds to loopback only, which is fine since
      # Metro and the simulator both run on this same machine.
      - name: Start Metro bundler
        run: |
          nohup npx expo start --dev-client --localhost --port 8081 > metro.log 2>&1 &

      - name: Wait for Metro to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8081/status | grep -q "packager-status:running"; then
              echo "Metro is up"
              exit 0
            fi
            sleep 2
          done
          echo "Metro did not become ready in time"
          cat metro.log
          exit 1

      # Two accounts are required because the ride flow is two-sided: one user
      # posts a ride, a second user joins it. The dev-client connects to Metro
      # by tapping the auto-detected server on its native launcher screen —
      # see .maestro/flows/login.yaml for why, no wiring needed here for it.
      #
      # Each flow gets its own destination string (so post-ride/join-ride/chat
      # don't collide, and so the ride each one creates can be cleaned up
      # afterward) and its own --test-output-dir (so screenshots/videos from
      # one flow don't get overwritten by the next). Retried once on failure —
      # the underlying device automation occasionally fails to attach with
      # infra-level flakiness unrelated to the app itself.
      - name: Run Maestro E2E suite
        env:
          EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          HOST_EMAIL: ${{ secrets.E2E_TEST_EMAIL_2 }}
          HOST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD_2 }}
        run: |
          STATUS=0

          run_flow() {
            local name="$1"; shift
            for attempt in 1 2; do
              if maestro test ".maestro/tests/${name}.yaml" \
                   --test-output-dir "maestro-report/${name}" \
                   "$@"; then
                return 0
              fi
              echo "::warning::${name}.yaml failed on attempt ${attempt}"
            done
            return 1
          }

          run_flow auth -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" || STATUS=1

          DEST1="E2E Test Dest $(date +%s)"
          run_flow post-ride -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" -e DESTINATION="$DEST1" || STATUS=1
          npx tsx tests/e2e/utils/cleanup-cli.ts "$EMAIL" "$PASSWORD" "$DEST1" || true

          DEST2="E2E Join Test $(date +%s)"
          run_flow join-ride -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" -e HOST_EMAIL="$HOST_EMAIL" -e HOST_PASSWORD="$HOST_PASSWORD" -e DESTINATION="$DEST2" || STATUS=1
          npx tsx tests/e2e/utils/cleanup-cli.ts "$HOST_EMAIL" "$HOST_PASSWORD" "$DEST2" || true

          DEST3="E2E Chat Test $(date +%s)"
          run_flow chat -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" -e DESTINATION="$DEST3" -e MESSAGE="Hello from Maestro $(date +%s)" || STATUS=1
          npx tsx tests/e2e/utils/cleanup-cli.ts "$EMAIL" "$PASSWORD" "$DEST3" || true

          exit $STATUS

      - name: Print Metro log on failure
        if: failure()
        run: cat metro.log || true

      - name: Upload Maestro report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: maestro-report/
          retention-days: 30
